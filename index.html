<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/icons8-bookmark-120.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> My To-Do List</title>
</head>
<body>
<div class="header">
    <h1>My To-Do List</h1>
    <p>Organizando minhas tarefas diárias</p>
</div>
<div class="container">
    <input type="text" id="taskInput" placeholder="Digite uma tarefa...">
    <button id="addTaskButton">Adicionar</button>
    <div id="taskBulkActions" hidden>
        <label id="selectAllTasksControl" for="selectAllTasks">
            <input type="checkbox" id="selectAllTasks">
            <span>Selecionar todas</span>
        </label>
        <button id="deleteAllTasksButton" type="button" hidden>Apagar todas</button>
    </div>
    <ul id="taskList"></ul>
</div>
<script src="main.js" defer></script>
</body>
</html>
