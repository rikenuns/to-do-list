<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bree+Serif&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Changa:wght@200..800&family=Itim&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap');
    </style>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/icons8-bookmark-120.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> My To-Do List</title>
</head>
<body>
<div class="header">
    <h1>My To-Do List</h1>
    <p>Organizando minhas tarefas diárias</p>
</div>
<div class="container">
    <input type="text" id="taskInput" placeholder="Digite uma tarefa...">
    <button id="addTaskButton">Adicionar</button>
    <label id="selectAllTasksControl" for="selectAllTasks">
        <input type="checkbox" id="selectAllTasks">
        <span>Selecionar todas</span>
    </label>
    <ul id="taskList"></ul>
</div>
<script src="main.js" defer></script>
</body>
</html>
