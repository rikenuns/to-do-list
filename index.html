<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="img/foto1.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> My To-Do List</title>
</head>
<body>
<div class="header">
    <h1>My To-Do List</h1>
    <p>Organizando minhas tarefas diárias</p>
</div>
<div class="container">
    <input type="text" id="taskInput" placeholder="Digite uma tarefa...">
    <button id="addTaskButton">Adicionar</button>
    <ul id="taskList"></ul>
 <button id="clearCompletedButton">Limpar Concluídas</button>
</div>
</body>
</html>
